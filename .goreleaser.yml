version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # Found the hard way, 2026-08-10: GoReleaser does NOT auto-detect a
  # semver prerelease tag (e.g. v0.4.0-beta.1) and mark the GitHub Release
  # as a prerelease unless told to — the default is "false" regardless of
  # the tag's own semver shape. v0.4.0-beta.1 was published as a full
  # release and had to be corrected after the fact (`gh release edit
  # --prerelease`) before this was set. "auto" makes GoReleaser check the
  # tag's own semver prerelease component itself, matching how every
  # other release/prerelease consumer of this tag (Terraform's own `~>`
  # constraint resolution, the Terraform Registry) already treats it.
  prerelease: auto
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
