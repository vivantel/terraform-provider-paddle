name: CI

on:
  push:
    branches: [master, feature/v1]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true
      - run: go mod tidy
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | (! grep .)
