name: Sweep

# Sweepers (internal/provider/sweep_test.go) are proven correct against the
# real sandbox (see docs/plans/paddle-provider-v2.md Step 3) but nothing
# ever actually invoked them automatically — only a manual `-sweep` run or
# their own dedicated verification tests exercised them. That's a real gap:
# terraform-plugin-testing's own destroy-on-failure already cleans up after
# a failed test *assertion*, but not after a CI runner that dies mid-test
# (timeout, OOM) before its own cleanup can run. This is the automatic path
# for that case.
#
# `-sweep=<locations>` alone (no `-run` needed) puts TestMain into
# sweep-only mode — it skips normal test execution entirely and runs only
# registered sweepers (confirmed via `go doc
# .../terraform-plugin-testing/helper/resource TestMain`, not assumed).
# "sandbox" is a placeholder location string; every sweeper function here
# ignores it — Paddle has no region concept, unlike the AWS-provider
# convention this pattern originates from.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
        # ./internal/provider/... (not just ./internal/provider) used to
        # be equivalent -- until internal/provider/actions existed
        # (2026-08-10). That subpackage has no TestMain/-sweep support of
        # its own (nothing in it is sweepable, it holds unit tests only),
        # so passing -sweep down into it just fails with an unrecognized
        # flag, found the hard way, 2026-08-11 (a real, if benign, sweep
        # run failure -- the actual sweepers in internal/provider still
        # ran and completed successfully despite it, but the job as a
        # whole reported failure). Scoped to the exact package that has
        # sweepers, not a wildcard that happens to have only ever matched
        # one package until now.
      # -timeout=30m — found the hard way, 2026-08-11: `go test`'s own
      # default 10-minute test timeout killed a real sweep run
      # ("*** Test killed with quit: ran too long (11m0s)") mid-way
      # through a large backlog (dozens of leaked customers accumulated
      # from a day of CI runs before createAdjustmentFixtureTransaction's
      # own per-test cleanup existed — see
      # action_paddle_adjustment_acc_test.go). Each leaked customer costs
      # several sequential API calls to clean up (list transactions,
      # cancel/credit each, archive the customer), so a large one-time
      # backlog can genuinely exceed 10 minutes even though a routine
      # weekly run (mostly nothing to sweep, now that per-test cleanup
      # exists) won't come close. timeout-minutes: 45 above gives this
      # room too — GitHub's own job-level default (360m) was never the
      # binding constraint, `go test`'s internal one was.
      - run: go test ./internal/provider -sweep=sandbox -v -timeout=30m
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          # paddle_test_subscription_charge sweeper (real invoices left
          # over from paddle_subscription_charge's acceptance test — see
          # its own comment in sweep_test.go) needs this to know which
          # subscription is the dedicated test fixture; no-ops without it.
          PADDLE_TEST_SUBSCRIPTION_ID: ${{ secrets.PADDLE_TEST_SUBSCRIPTION_ID }}
